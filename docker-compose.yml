# Local services for RecallOps: Postgres 16 with pgvector (system of record; document_chunks since M2) and Neo4j
# Community (the derived fraud graph since M5; owner decision 2026-10-18). The M1 Postgres volume (postgres:16, 16.14)
# opens unchanged: same major version and data directory format.
name: recallops

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - recallops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  graph:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graph-dev-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-57687}:7687"
    volumes:
      - recallops_graph:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  recallops_pg:
  recallops_graph:
