# Local Postgres for RecallOps: Postgres 16 with pgvector (document_chunks, M2). The M1 volume (postgres:16, 16.14)
# opens unchanged: same major version and data directory format.
name: recallops

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - recallops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recallops_pg:
