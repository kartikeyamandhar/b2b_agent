<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">RecallOps architecture</title>
  <desc id="desc">Four layers, top to bottom. People: company staff (admin or reviewer, one Clerk account per company), claimants on a phone with no account, and the platform operator who approves which company may run which recall. The website on Vercel (apps/web, Next.js): the console, the claim portal, and the operator window; its server makes every call to the API. The backend on Render (apps/api, Python): the FastAPI web service, which checks the sign-in token or signed claim link and sets the company for row-level security; the worker, which runs the LangGraph claims agent under caps of 8 steps, 0.02 USD, and 60 seconds and stops for a person by interrupt; and two scheduled jobs for refund transfers and the nightly mailed-check export. The data layer: Postgres with pgvector on Supabase as the system of record with row-level security forced on every company table, a private Supabase photo bucket, and a Neo4j AuraDB fraud graph rebuilt from Postgres that decides nothing. On the right, the outside services reached over HTTPS: Clerk for sign-in, the public CPSC recall API, Claude Haiku for photo reading and the agent, and Stripe in test mode for company plans and claimant refunds; the monthly progress report PDF is the output a company files with CPSC.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path class="ahead" d="M1,1.5 L9,5 L1,8.5 Z"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path class="ahead" d="M9,1.5 L1,5 L9,8.5 Z"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); stroke-width: 1; }
    .band { fill: #f6f6f3; stroke: #e1e0d9; stroke-width: 1; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .mut { fill: #898781; }
    .hair { stroke: #c3c2b7; stroke-width: 1; fill: none; }
    .flow { stroke: #898781; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .ahead { fill: #898781; }
    .bus { fill: #f9f9f7; stroke: #c3c2b7; stroke-width: 1; }
    .t-in { fill: #eb6834; fill-opacity: 0.07; stroke: #eb6834; stroke-width: 1.5; }
    .t-web { fill: #6250d6; fill-opacity: 0.08; stroke: #6250d6; stroke-width: 1.5; }
    .t-be { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 1.5; }
    .t-st { fill: #1baf7a; fill-opacity: 0.09; stroke: #1baf7a; stroke-width: 1.5; }
    .t-ex { fill: #898781; fill-opacity: 0.07; stroke: #898781; stroke-width: 1.5; }
    .s-in { fill: #eb6834; }
    .s-web { fill: #6250d6; }
    .s-be { fill: #2a78d6; }
    .s-st { fill: #1baf7a; }
    .s-ex { fill: #898781; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
      .band { fill: #141413; stroke: #2c2c2a; }
      .ink { fill: #f0efec; }
      .ink2 { fill: #c3c2b7; }
      .mut { fill: #898781; }
      .hair { stroke: #383835; }
      .flow { stroke: #898781; }
      .ahead { fill: #898781; }
      .bus { fill: #0d0d0d; stroke: #383835; }
      .t-in { fill: #d95926; fill-opacity: 0.14; stroke: #d95926; }
      .t-web { fill: #9085e9; fill-opacity: 0.13; stroke: #9085e9; }
      .t-be { fill: #3987e5; fill-opacity: 0.13; stroke: #3987e5; }
      .t-st { fill: #199e70; fill-opacity: 0.14; stroke: #199e70; }
      .t-ex { fill: #898781; fill-opacity: 0.14; stroke: #a3a29b; }
      .s-in { fill: #d95926; }
      .s-web { fill: #9085e9; }
      .s-be { fill: #3987e5; }
      .s-st { fill: #199e70; }
      .s-ex { fill: #a3a29b; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="1199" height="849" rx="16"/>

  <text class="ink" x="40" y="50" font-size="26" font-weight="600">Architecture</text>
  <text class="ink2" x="40" y="77" font-size="15">Who uses RecallOps, where each part runs, and what it talks to. Everything except the outside services on the right is in this repository.</text>

  <!-- people -->
  <rect class="t-in" x="56" y="110" width="252" height="86" rx="10"/>
  <text class="ink" x="72" y="134" font-size="15" font-weight="600">Company staff</text>
  <text class="ink2" x="72" y="155" font-size="13">An admin or a reviewer. One Clerk</text>
  <text class="ink2" x="72" y="172" font-size="13">account is one company</text>

  <rect class="t-in" x="324" y="110" width="252" height="86" rx="10"/>
  <text class="ink" x="340" y="134" font-size="15" font-weight="600">Claimant</text>
  <text class="ink2" x="340" y="155" font-size="13">On a phone, with no account. Starts</text>
  <text class="ink2" x="340" y="172" font-size="13">from the product's public claim link</text>

  <rect class="t-in" x="592" y="110" width="252" height="86" rx="10"/>
  <text class="ink" x="608" y="134" font-size="15" font-weight="600">Platform operator</text>
  <text class="ink2" x="608" y="155" font-size="13">Confirms that a company really</text>
  <text class="ink2" x="608" y="172" font-size="13">issued the recall it asks to run</text>

  <path class="flow" d="M182 196 V228" marker-end="url(#ah)"/>
  <path class="flow" d="M450 196 V228" marker-end="url(#ah)"/>
  <path class="flow" d="M718 196 V228" marker-end="url(#ah)"/>

  <!-- website -->
  <rect class="band" x="40" y="230" width="820" height="142" rx="12"/>
  <text class="ink" x="56" y="254" font-size="14" font-weight="600">Website on Vercel</text>
  <text class="mut" x="184" y="254" font-size="13">apps/web, Next.js 16 and React 19</text>

  <rect class="t-web" x="56" y="266" width="252" height="92" rx="10"/>
  <text class="ink" x="72" y="290" font-size="15" font-weight="600">Console</text>
  <text class="mut" x="136" y="290" font-size="12">/app</text>
  <text class="ink2" x="72" y="310" font-size="13">Claims queue, claim detail with</text>
  <text class="ink2" x="72" y="327" font-size="13">photos, agent trace, fraud rings,</text>
  <text class="ink2" x="72" y="344" font-size="13">payouts, monthly report, billing</text>

  <rect class="t-web" x="324" y="266" width="252" height="92" rx="10"/>
  <text class="ink" x="340" y="290" font-size="15" font-weight="600">Claim portal</text>
  <text class="mut" x="438" y="290" font-size="12">/file, /claim</text>
  <text class="ink2" x="340" y="310" font-size="13">Six steps on a phone, then the</text>
  <text class="ink2" x="340" y="327" font-size="13">decision in plain words and a</text>
  <text class="ink2" x="340" y="344" font-size="13">refund by check or bank transfer</text>

  <rect class="t-web" x="592" y="266" width="252" height="92" rx="10"/>
  <text class="ink" x="608" y="290" font-size="15" font-weight="600">Operator window</text>
  <text class="mut" x="736" y="290" font-size="12">/operator</text>
  <text class="ink2" x="608" y="310" font-size="13">Approves or refuses each</text>
  <text class="ink2" x="608" y="327" font-size="13">company's request to run a recall</text>

  <path class="flow" d="M182 372 V406" marker-end="url(#ah)"/>
  <text class="mut" x="194" y="394" font-size="12">HTTPS from the website's server, with the Clerk session token or the signed claim link</text>

  <!-- backend -->
  <rect class="band" x="40" y="408" width="820" height="200" rx="12"/>
  <text class="ink" x="56" y="432" font-size="14" font-weight="600">Backend on Render</text>
  <text class="mut" x="190" y="432" font-size="13">apps/api, Python 3.13</text>

  <rect class="t-be" x="56" y="446" width="252" height="146" rx="10"/>
  <text class="ink" x="72" y="470" font-size="15" font-weight="600">API</text>
  <text class="mut" x="104" y="470" font-size="12">FastAPI web service</text>
  <text class="ink2" x="72" y="490" font-size="13">Checks the sign-in token or claim</text>
  <text class="ink2" x="72" y="507" font-size="13">link, then sets the company for</text>
  <text class="ink2" x="72" y="524" font-size="13">row-level security on the session</text>
  <text class="ink2" x="72" y="541" font-size="13">Products, claims, portal, payouts,</text>
  <text class="ink2" x="72" y="558" font-size="13">monthly report, Stripe webhooks</text>
  <text class="ink2" x="72" y="575" font-size="13">Reads each notice into rules</text>

  <rect class="t-be" x="324" y="446" width="252" height="146" rx="10"/>
  <text class="ink" x="340" y="470" font-size="15" font-weight="600">Worker</text>
  <text class="mut" x="398" y="470" font-size="12">background service</text>
  <text class="ink2" x="340" y="490" font-size="13">Runs the claims agent (LangGraph)</text>
  <text class="ink2" x="340" y="507" font-size="13">on each submitted claim</text>
  <text class="ink2" x="340" y="524" font-size="13">Caps: 8 steps, $0.02, 60 seconds</text>
  <text class="ink2" x="340" y="541" font-size="13">Stops for a person by interrupt</text>
  <text class="ink2" x="340" y="558" font-size="13">Cost meter before every model call</text>
  <text class="ink2" x="340" y="575" font-size="13">Writes each decision to the graph</text>

  <rect class="t-be" x="592" y="446" width="252" height="146" rx="10"/>
  <text class="ink" x="608" y="470" font-size="15" font-weight="600">Scheduled jobs</text>
  <text class="mut" x="724" y="470" font-size="12">two cron jobs</text>
  <text class="ink2" x="608" y="490" font-size="13">Every 10 minutes: refund transfers,</text>
  <text class="ink2" x="608" y="507" font-size="13">reconciliation with Stripe, and</text>
  <text class="ink2" x="608" y="524" font-size="13">refund-choice deadlines</text>
  <text class="ink2" x="608" y="541" font-size="13">Every night: the export batch of</text>
  <text class="ink2" x="608" y="558" font-size="13">refunds paid by mailed check</text>

  <path class="flow" d="M450 610 V642" marker-start="url(#at)" marker-end="url(#ah)"/>
  <text class="mut" x="462" y="630" font-size="12">reads and writes; the graph is updated after Postgres commits</text>

  <!-- data -->
  <rect class="band" x="40" y="644" width="820" height="140" rx="12"/>
  <text class="ink" x="56" y="668" font-size="14" font-weight="600">Data</text>
  <text class="mut" x="96" y="668" font-size="13">Supabase and Neo4j AuraDB</text>

  <rect class="t-st" x="56" y="682" width="252" height="88" rx="10"/>
  <text class="ink" x="72" y="706" font-size="15" font-weight="600">Postgres with pgvector</text>
  <text class="ink2" x="72" y="726" font-size="13">System of record. Row-level security</text>
  <text class="ink2" x="72" y="743" font-size="13">forced on every company table.</text>
  <text class="ink2" x="72" y="760" font-size="13">Agent checkpoints live here too</text>

  <rect class="t-st" x="324" y="682" width="252" height="88" rx="10"/>
  <text class="ink" x="340" y="706" font-size="15" font-weight="600">Photo storage</text>
  <text class="ink2" x="340" y="726" font-size="13">Private bucket. The API streams</text>
  <text class="ink2" x="340" y="743" font-size="13">each photo after the company check</text>

  <rect class="t-st" x="592" y="682" width="252" height="88" rx="10"/>
  <text class="ink" x="608" y="706" font-size="15" font-weight="600">Fraud graph</text>
  <text class="mut" x="704" y="706" font-size="12">Neo4j</text>
  <text class="ink2" x="608" y="726" font-size="13">Rebuilt from Postgres after each</text>
  <text class="ink2" x="608" y="743" font-size="13">decision. It decides nothing</text>

  <!-- outside services -->
  <rect class="bus" x="872" y="110" width="24" height="671" rx="12"/>
  <text class="ink2" font-size="13" font-weight="600" letter-spacing="0.5" text-anchor="middle" transform="translate(888.5 445) rotate(-90)">Outside services over HTTPS</text>
  <line class="hair" x1="860" y1="301" x2="872" y2="301"/>
  <line class="hair" x1="860" y1="519" x2="872" y2="519"/>

  <rect class="t-ex" x="908" y="110" width="252" height="123" rx="10"/>
  <text class="ink" x="924" y="136" font-size="15" font-weight="600">Clerk</text>
  <text class="mut" x="968" y="136" font-size="12">sign-in</text>
  <text class="ink2" x="924" y="158" font-size="13">Sign-up and sign-in pages for the</text>
  <text class="ink2" x="924" y="175" font-size="13">website. The API checks each</text>
  <text class="ink2" x="924" y="192" font-size="13">session token against its keys</text>

  <rect class="t-ex" x="908" y="247" width="252" height="123" rx="10"/>
  <text class="ink" x="924" y="273" font-size="15" font-weight="600">CPSC recall API</text>
  <text class="ink2" x="924" y="295" font-size="13">The public saferproducts.gov</text>
  <text class="ink2" x="924" y="312" font-size="13">feed, no key needed. The API</text>
  <text class="ink2" x="924" y="329" font-size="13">pulls new recalls every night</text>

  <rect class="t-ex" x="908" y="384" width="252" height="123" rx="10"/>
  <text class="ink" x="924" y="410" font-size="15" font-weight="600">Claude Haiku</text>
  <text class="mut" x="1024" y="410" font-size="12">Anthropic</text>
  <text class="ink2" x="924" y="432" font-size="13">Reads label and destruction photos</text>
  <text class="ink2" x="924" y="449" font-size="13">and drives the agent. Every call</text>
  <text class="ink2" x="924" y="466" font-size="13">passes the cost meter first</text>

  <rect class="t-ex" x="908" y="521" width="252" height="123" rx="10"/>
  <text class="ink" x="924" y="547" font-size="15" font-weight="600">Stripe</text>
  <text class="mut" x="976" y="547" font-size="12">test mode only</text>
  <text class="ink2" x="924" y="569" font-size="13">Billing for company plans,</text>
  <text class="ink2" x="924" y="586" font-size="13">Connect for claimant refunds,</text>
  <text class="ink2" x="924" y="603" font-size="13">signed webhooks back to the API</text>

  <rect class="t-in" x="908" y="658" width="252" height="123" rx="10"/>
  <text class="ink" x="924" y="684" font-size="15" font-weight="600">Monthly progress report</text>
  <text class="ink2" x="924" y="706" font-size="13">The PDF a company files with</text>
  <text class="ink2" x="924" y="723" font-size="13">CPSC, computed in SQL and</text>
  <text class="ink2" x="924" y="740" font-size="13">checked by an independent recount</text>

  <line class="hair" x1="896" y1="171" x2="908" y2="171"/>
  <line class="hair" x1="896" y1="308" x2="908" y2="308"/>
  <line class="hair" x1="896" y1="445" x2="908" y2="445"/>
  <line class="hair" x1="896" y1="582" x2="908" y2="582"/>
  <line class="hair" x1="896" y1="719" x2="908" y2="719"/>

  <!-- legend -->
  <g font-size="13">
    <rect class="s-in" x="40" y="808" width="12" height="12" rx="3"/>
    <text class="ink2" x="60" y="819">People and the CPSC filing</text>
    <rect class="s-web" x="250" y="808" width="12" height="12" rx="3"/>
    <text class="ink2" x="270" y="819">Website</text>
    <rect class="s-be" x="350" y="808" width="12" height="12" rx="3"/>
    <text class="ink2" x="370" y="819">Backend</text>
    <rect class="s-st" x="450" y="808" width="12" height="12" rx="3"/>
    <text class="ink2" x="470" y="819">Data</text>
    <rect class="s-ex" x="530" y="808" width="12" height="12" rx="3"/>
    <text class="ink2" x="550" y="819">Outside services</text>
  </g>
</svg>
