<title id="title">Adjudication ablation: macro F1 by block</title>
<desc id="desc">Macro F1 of six adjudicator configurations on three claim blocks. Synthetic golden claims (golden300): Rules only 0.982, Rules + vision 0.933, Single pass 0.919, Agent loop (full) 0.916, Agent, no retrieval 0.908, Agent, keyword retrieval 0.915. Rules-blind probe (probe60): Rules only 0.095, Rules + vision 0.726, Single pass 0.663, Agent loop (full) 0.703, Agent, no retrieval 0.699, Agent, keyword retrieval 0.691. Written blind to the generator (standin40): Rules only 0.583, Rules + vision 0.668, Single pass 0.710, Agent loop (full) 0.774, Agent, no retrieval 0.718, Agent, keyword retrieval 0.774.</desc>
