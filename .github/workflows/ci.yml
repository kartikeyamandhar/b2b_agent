name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest + coverage)
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-dev-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      graph:
        image: neo4j:2026.09.0-community
        env:
          NEO4J_AUTH: neo4j/graph-dev-only
          NEO4J_server_memory_heap_max__size: 512m
        ports: ["57687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graph-dev-only 'RETURN 1'" --health-interval 3s
          --health-timeout 5s --health-retries 60
    env:
      PGPASSWORD: postgres-dev-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.13"
      - run: uv --version
      - name: Environment
        run: cp .env.example .env
      - name: Install pinned dependencies
        run: uv sync --project apps/api --frozen
      - name: Roles and databases
        run: |
          for db in recallops recallops_test; do
            psql -h localhost -p 55432 -U postgres -v ON_ERROR_STOP=1 -q \
              -v owner_password=owner-dev-only -v app_password=app-dev-only \
              -v internal_password=internal-dev-only -v dbname=$db -f apps/api/sql/bootstrap_roles.sql
          done
      - name: Migrations
        working-directory: apps/api
        run: |
          for db in recallops recallops_test; do
            uv run --frozen alembic -x dburl=postgresql://recallops_owner:owner-dev-only@localhost:55432/$db upgrade head
          done
      - name: Lint
        working-directory: apps/api
        run: uv run --frozen ruff check src tests migrations ../../docs/assets/src && uv run --frozen ruff format --check src tests migrations ../../docs/assets/src
      - name: Types
        working-directory: apps/api
        run: uv run --frozen mypy
      - name: Tests with coverage (includes the OpenAPI drift test and the golden-set reproducibility test)
        working-directory: apps/api
        run: uv run --frozen pytest --cov --cov-report=term --cov-fail-under=85

  # ---------------------------------------------------------------------------------------------
  # WEB HALF: owned by the UI owner (component 2). apps/web does not exist yet; this job switches on when the UI
  # owner commits apps/web/package-lock.json (npm install with Node 22.22.0), and reports skipped until then.
  # hashFiles() is not allowed in a job-level if, so the job detects the lockfile in its first step.
  # ---------------------------------------------------------------------------------------------
  web:
    name: web (tsc, vitest) - owned by the UI owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect the web lockfile
        id: detect
        run: |
          if [ -f apps/web/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web/package-lock.json not present yet; web checks skipped"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: npx vitest run
