# Render blueprint for the backend (CLAUDE.md layout: infra/ holds render.yaml only). The live services were created
# from this file on 2026-10-21 through Render's API, with secrets supplied from the owner's machine, never this
# repository (docs/DEPLOY.md). Keep it in step with the live services: a change here does not change them by itself.
#
# APP_ENV=prod on purpose: the dev auth provider and dev claim tokens refuse to load in prod, so the API runs only with
# the Clerk provider and HMAC claim links (component 4), and prod settings refuse example, localhost, or plain-http
# Clerk, portal, and payment values (both services load them, so both need PORTAL_BASE_URL). Never deploy with
# APP_ENV=dev: the dev provider trusts request headers. The API uses only DATABASE_URL (recallops_app, RLS enforced);
# the worker is a separate service holding DATABASE_URL_INTERNAL, so the web process never has the BYPASSRLS role
# (invariant 2).
# Render's free tier has no background workers: the worker service needs a paid instance type, or run it elsewhere.
# The health check is /healthz: /readyz reports a degraded graph or a stale worker but must not restart the API.
# Region virginia: next to the Supabase database (us-east-1); Oregon adds about 70 ms to every query.
services:
  - type: web
    name: recallops-api
    region: virginia
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install uv==0.11.21 && uv sync --frozen
    # --no-access-log: a claim link's token is in the URL path, so uvicorn's access log would write every claimant's
    # credential to the log stream (the app's own request log redacts it; backend review of PR 8).
    startCommand: PYTHONPATH=src uv run --frozen uvicorn recallops.api.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.13"
      - key: LLM_MODE
        value: replay
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: AUTH_PROVIDER
        value: clerk
      - key: CLAIM_TOKEN_PROVIDER
        value: hmac
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: NEO4J_NAMESPACE
        value: prod
      - key: GRAPH_KEY_SECRET
        sync: false
      - key: INTERNAL_SHARED_SECRET
        sync: false
      - key: CLAIM_TOKEN_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: WEB_PROXY_SECRET   # the same value as the web app's RECALLOPS_WEB_PROXY_SECRET (32+ characters)
        sync: false
      - key: PORTAL_BASE_URL   # the deployed site's claim page, for example https://<app>.vercel.app/claim
        sync: false
      - key: CLERK_JWKS_URL   # optional: leave unset to derive it from CLERK_ISSUER
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_ALLOWED_ORIGINS
        sync: false
      - key: PLATFORM_OPERATOR_USER_IDS   # Clerk user ids allowed to approve organizations (company verification)
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Payments (component 3): test-mode only. With STRIPE_SECRET_KEY set, prod settings refuse localhost or
      # dev-console return URLs and empty price ids. The billing and Connect jobs (make billing-jobs, make
      # connect-payouts) need a scheduled job placement that this free-tier blueprint does not define yet.
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PROGRAM_PRICE_ID
        sync: false
      - key: STRIPE_CLAIM_PRICE_ID
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false
      - key: BILLING_RETURN_URL
        sync: false
      - key: CONNECT_RETURN_URL
        sync: false
      - key: CONNECT_REFRESH_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
  - type: worker
    name: recallops-worker
    region: virginia
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install uv==0.11.21 && uv sync --frozen
    startCommand: PYTHONPATH=src uv run --frozen python -m recallops.claims.worker
    envVars:
      - key: APP_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ADJUDICATOR
        value: agent
      - key: LLM_MODE
        value: live
      # The meter's ledger is this database's agent_steps plus this carried amount: the 1.630266 USD spent in
      # development, rounded up, so the 4.00 USD stop stays cumulative across both databases.
      - key: LLM_SPEND_CARRIED_USD
        value: "1.64"
      - key: DATABASE_URL_INTERNAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: NEO4J_NAMESPACE
        value: prod
      - key: GRAPH_KEY_SECRET
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PORTAL_BASE_URL   # the same value as the API's; prod settings refuse the localhost default
        sync: false
  # Scheduled jobs (decisions log: the billing and Connect jobs had no scheduled home). They use the BYPASSRLS
  # role like the worker, so they run as their own services, never inside the web process. Render bills cron jobs by
  # the minute on a paid plan; without them, usage is not reported to Stripe, Connect refunds are not sent, and
  # check batches are made only when an admin presses "Create export batch" in the console.
  - type: cron
    name: recallops-payment-jobs
    region: virginia
    runtime: python
    rootDir: apps/api
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install uv==0.11.21 && uv sync --frozen
    startCommand: PYTHONPATH=src uv run --frozen python -m recallops.billing.jobs && PYTHONPATH=src uv run --frozen python -m recallops.payouts.stripe_connect
    envVars:
      - key: APP_ENV
        value: prod
      - key: NEO4J_URI   # empty: the graph is disabled here; prod refuses the development graph defaults
        value: ""
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL_INTERNAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PROGRAM_PRICE_ID
        sync: false
      - key: STRIPE_CLAIM_PRICE_ID
        sync: false
      - key: BILLING_RETURN_URL
        sync: false
      - key: CONNECT_RETURN_URL
        sync: false
      - key: CONNECT_REFRESH_URL
        sync: false
  - type: cron
    name: recallops-check-export
    region: virginia
    runtime: python
    rootDir: apps/api
    plan: starter
    schedule: "30 6 * * *"
    buildCommand: pip install uv==0.11.21 && uv sync --frozen
    startCommand: PYTHONPATH=src uv run --frozen python -m recallops.payouts.export
    envVars:
      - key: APP_ENV
        value: prod
      - key: NEO4J_URI   # empty: the graph is disabled here; prod refuses the development graph defaults
        value: ""
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL_INTERNAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_BASE_URL
        sync: false
