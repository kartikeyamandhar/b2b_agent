<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallOps test console</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --surface-3: #e4e8ed;
  --border: #dde1e6; --border-strong: #c3c9d1;
  --text: #1a1e23; --muted: #5b6470;
  --accent: #2a78d6; --accent-hover: #2266b8; --accent-weak: #e6eff9; --link: #1f66bd;
  --green-fg: #1d7a3e; --green-bg: #e2f3e7;
  --red-fg: #b3261e; --red-bg: #fce8e6;
  --amber-fg: #8a5800; --amber-bg: #fcefd2;
  --violet-fg: #6a3db5; --violet-bg: #efe6fb;
  --blue-fg: #1f5ea8; --blue-bg: #e3edfa;
  --gray-fg: #59616c; --gray-bg: #e9ecef;
  --k-photo: #e8590c; --k-address: #0b8a8a; --k-serial: #7048e8; --k-payout: #c2255c; --k-mailing: #5c940d;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .20);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111317; --surface: #191c21; --surface-2: #21252b; --surface-3: #2c3138;
    --border: #2e333a; --border-strong: #434a54;
    --text: #e5e8ec; --muted: #9ba4af;
    --accent: #2a78d6; --accent-hover: #3b88e6; --accent-weak: #18293f; --link: #7fb2ef;
    --green-fg: #6fcf8f; --green-bg: #16301f;
    --red-fg: #f2958c; --red-bg: #3a1b19;
    --amber-fg: #edc16a; --amber-bg: #352912;
    --violet-fg: #c3a6f4; --violet-bg: #2a2140;
    --blue-fg: #8db9ef; --blue-bg: #172b45;
    --gray-fg: #b1b8c1; --gray-bg: #2a2e35;
    --k-photo: #ff8a3d; --k-address: #2bb8b8; --k-serial: #a08af7; --k-payout: #f06595; --k-mailing: #94d82d;
    --shadow: none;
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; max-height: 420px; margin: 6px 0; }
pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
pre.inline { margin: 0; padding: 4px 8px; max-height: 160px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
h3 { font-size: 12px; margin: 14px 0 6px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 6px 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.lead { font-size: 16px; font-weight: 560; margin: 2px 0 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; white-space: nowrap; }
.logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; }
.devtag { font-size: 11px; font-weight: 600; color: var(--amber-fg); background: var(--amber-bg); border-radius: 4px; padding: 1px 6px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; flex: 1; min-width: 0; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.ctl.grow { flex: 1; min-width: 220px; }
.ctl.grow select { width: 100%; min-width: 0; }
.ctl input.bad { border-color: var(--red-fg); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.pill-sep { width: 1px; height: 14px; background: var(--border-strong); margin: 0 3px; }

/* shell */
.shell { display: grid; grid-template-columns: 184px minmax(0, 1fr); align-items: start; }
.sidenav { position: sticky; top: var(--top-h, 57px); height: calc(100vh - var(--top-h, 57px)); overflow-y: auto; padding: 14px 10px; border-right: 1px solid var(--border); background: var(--surface); }
.sidenav a { display: block; padding: 7px 10px; border-radius: 7px; color: var(--text); margin-bottom: 2px; }
.sidenav a:hover { background: var(--surface-2); text-decoration: none; }
.sidenav a.active { background: var(--accent-weak); color: var(--link); font-weight: 600; }
.sidenav .navnote { margin: 16px 10px 0; font-size: 12px; color: var(--muted); }
main { padding: 20px 24px 90px; min-width: 0; }
#view { max-width: 1320px; }

/* cards and layout */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.page-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid2 > .card { margin-bottom: 0; }
.claim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; align-items: start; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.end { align-items: flex-end; }
.row + .row, form.row + form.row { margin-top: 10px; }
.grow { flex: 1; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.card .stat { background: var(--surface-2); }
.stat-v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-l { color: var(--muted); font-size: 12.5px; }

/* tones, badges, tags */
.t-green { --tone-fg: var(--green-fg); --tone-bg: var(--green-bg); }
.t-red { --tone-fg: var(--red-fg); --tone-bg: var(--red-bg); }
.t-amber { --tone-fg: var(--amber-fg); --tone-bg: var(--amber-bg); }
.t-violet { --tone-fg: var(--violet-fg); --tone-bg: var(--violet-bg); }
.t-blue { --tone-fg: var(--blue-fg); --tone-bg: var(--blue-bg); }
.t-gray { --tone-fg: var(--gray-fg); --tone-bg: var(--gray-bg); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; color: var(--tone-fg, var(--gray-fg)); background: var(--tone-bg, var(--gray-bg)); border: none; font-family: inherit; vertical-align: middle; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
button.badge { cursor: pointer; }
button.badge:hover { filter: brightness(.95); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--tone-fg, var(--gray-fg)); }
.tag { display: inline-block; padding: 0 7px; border-radius: 5px; border: 1px solid var(--border-strong); font-size: 12px; color: var(--muted); line-height: 19px; white-space: nowrap; vertical-align: middle; }
.tag-ok { border-color: var(--green-fg); color: var(--green-fg); }
.tag-human { border-color: var(--amber-fg); color: var(--amber-fg); }
.text-green { color: var(--green-fg); }
.text-red { color: var(--red-fg); }
.note { border-left: 3px solid var(--tone-fg, var(--border-strong)); background: var(--tone-bg, var(--surface-2)); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
.counts { display: flex; flex-wrap: wrap; gap: 4px; }

/* buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 550; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--red-fg); border-color: var(--red-fg); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: progress; }
.copy { font: inherit; font-size: 11px; padding: 0 6px; margin-left: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-2); color: var(--muted); cursor: pointer; line-height: 18px; vertical-align: middle; }
.copy:hover { color: var(--text); }
input, select, textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
input[type=file] { padding: 4px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.form-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.form-actions .note { margin: 0 auto 0 0; }
fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px 8px; margin: 0; }
legend { font-size: 12.5px; color: var(--muted); padding: 0 4px; }
fieldset label { display: inline-flex; gap: 6px; margin-right: 14px; align-items: center; }
fieldset.radios label { display: flex; margin: 4px 0; }
.stack > * + * { margin-top: 10px; }

/* tables */
.table-wrap { overflow: auto; }
.table-wrap.tall { max-height: 68vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td, tr.rowlink:focus-visible td { background: var(--accent-weak); }
tr.rowlink:focus-visible { outline: none; }
tr.selected td { background: var(--surface-2); }
.table-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
.empty { text-align: center; color: var(--muted); padding: 24px; }
.title-cell { font-weight: 550; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12.5px; }
.chip:hover { text-decoration: none; background: var(--surface-2); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .count { opacity: .7; font-variant-numeric: tabular-nums; }
.chip.active .dot { box-shadow: 0 0 0 1.5px #fff; }

/* error panel and toast */
.errors { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: min(440px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 110px); overflow: auto; }
.errors:empty { display: none; }
.err { background: var(--surface); border: 1px solid var(--red-fg); border-left-width: 4px; border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow-lg); font-size: 13px; }
.err-head { display: flex; gap: 8px; align-items: baseline; }
.err-head strong { color: var(--red-fg); }
.err-req { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.err .hint { background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
.err-all { align-self: flex-end; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .15s; }
.toast.show { opacity: 1; }

/* claim detail and trace */
.trace { list-style: none; margin: 12px 0 0 6px; padding: 0; border-left: 2px solid var(--border); }
.step { position: relative; padding: 6px 0 12px 18px; }
.step::before { content: ""; position: absolute; left: -7px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
.step.llm::before { border-color: var(--accent); background: var(--accent); }
.step-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-idx { color: var(--muted); min-width: 22px; }
.step-node { font-weight: 650; }
.metric { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.thought { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-weak); border-radius: 0 6px 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.thought-label { font-size: 11px; font-weight: 650; color: var(--link); text-transform: uppercase; letter-spacing: .04em; display: block; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; padding: 2px 0; overflow-wrap: anywhere; }
details > summary code { color: var(--text); }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 12px 0; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.fill { display: block; height: 100%; background: var(--accent); }
.fill-amber { background: var(--amber-fg); }
.fill-red { background: var(--red-fg); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.thumb { margin: 0; min-width: 0; }
.thumb-btn { display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; position: relative; }
.thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
.thumb-btn img:not([src]) { visibility: hidden; }
.thumb-ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; padding: 6px; text-align: center; }
.thumb figcaption { display: flex; flex-direction: column; font-size: 12px; margin-top: 4px; min-width: 0; }
.thumb figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cluster { padding: 8px 0; border-top: 1px solid var(--border); }
.cluster:first-of-type { border-top: none; padding-top: 0; }
.cluster-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.members { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; margin-right: 8px; white-space: nowrap; }
.swatch { width: 22px; height: 0; border-top: 3px solid var(--sw); flex: none; }
.swatch.dashed { border-top-style: dashed; }
.swatch.dotted { border-top-style: dotted; }
dialog#lightbox { border: none; border-radius: 12px; padding: 12px; background: var(--surface); color: var(--text); max-width: 94vw; max-height: 94vh; box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
#lightboxImg { max-width: 88vw; max-height: 80vh; display: block; margin: 8px auto; }
.lb-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* portal */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.photo-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.photo-preview { aspect-ratio: 4 / 3; border: 1px dashed var(--border-strong); border-radius: 8px; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); }
.photo-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
.messages { list-style: none; padding: 0; }
.msg { padding: 6px 10px; border-radius: 8px; margin: 6px 0; background: var(--surface-2); }
.msg-firm { border-left: 3px solid var(--accent); }

/* fraud */
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 6px 0; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.ring-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; align-items: start; }
.ring-card { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px 10px; min-width: 0; }
.ring-card svg { width: 100%; height: auto; display: block; }
.ring-card .edges line, .ring-card .edges path { stroke-width: 3; fill: none; stroke-linecap: round; }
.ring-card circle.node { stroke: var(--surface); stroke-width: 2.5; }
.ring-card a:hover circle.node, .ring-card a:focus-visible circle.node { stroke: var(--text); }
.ring-card a:focus-visible { outline: none; }
.ring-card figcaption { font-size: 12.5px; }

/* misc */
.cmd { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 6px 0 2px; }
.cmd code { border: none; background: none; padding: 0; flex: 1; }
.cmd-note { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.checklist li { margin: 7px 0; }
.idchip { white-space: nowrap; }
.option { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.evidence li { margin: 4px 0; }

@media (max-width: 1100px) { .claim-grid { grid-template-columns: minmax(0, 1fr); } .topbar .controls { order: 3; flex-basis: 100%; } .topbar .brand { flex: 1; } }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .meters { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .topbar { position: static; } /* about 170 px tall when wrapped: pinned, it would cover a fifth of a phone screen */
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav { position: static; height: auto; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 6px 8px; }
  .sidenav a { white-space: nowrap; margin: 0 2px; }
  .sidenav .navnote { display: none; }
  main { padding: 16px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">R</span><span>RecallOps test console</span><span class="devtag">dev only</span></div>
  <div class="controls">
    <label class="ctl"><span>Firm</span><select id="firmSel"></select></label>
    <label class="ctl" id="customWrap" hidden><span>Firm id</span><input id="firmCustom" class="mono" size="36" placeholder="00000000-0000-4000-8000-000000000000" spellcheck="false" autocomplete="off"></label>
    <label class="ctl"><span>Role</span><select id="roleSel"><option value="admin">admin</option><option value="reviewer">reviewer</option></select></label>
    <label class="ctl grow"><span>Program</span><select id="programSel"></select></label>
  </div>
  <button id="readyPill" class="pill" type="button" title="Readiness from GET /readyz. Click to check again.">checking readiness</button>
</header>
<div class="shell">
  <nav class="sidenav" aria-label="Views" id="sidenav"></nav>
  <main id="main"><div id="view"><p class="muted">Loading...</p></div></main>
</div>
<div id="errors" class="errors" aria-live="assertive"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="lightbox" aria-labelledby="lightboxCap">
  <div class="lb-head"><strong id="lightboxCap">Photo</strong><form method="dialog"><button class="btn small">Close</button></form></div>
  <img id="lightboxImg" alt="">
</dialog>
<script>
'use strict';

/* ---------- constants ---------- */
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const UUID_ANY = /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i;

class ApiError extends Error { constructor(o) { super(o.title || 'Request failed'); Object.assign(this, o); } }
// A 422 detail is the Python repr of pydantic's error list, for example

// Show it as "identification_rules.bogus: Extra inputs are not permitted"; anything else passes through unchanged.

async function settle(read, ok, ctx) {
  let v = await read();

const errorsEl = $('#errors');

  if (e.status === 404 && /^\/v1\/claims\//.test(p)) return 'Tenant isolation: the API answers 404 for a claim that belongs to another firm, the same as for a claim that does not exist. Switch the firm in the top bar if this claim is yours.';
  if (e.status === 404 && /^\/v1\/programs\//.test(p)) return 'The program is not visible to this firm (tenant isolation) or does not exist.';
  if (e.status === 404 && /^\/portal\//.test(p)) return 'The claim link is not valid, or its program is closed. Dev tokens look like dev.<firm id>.<claim id>.';
  if (e.status === 403 && /admin/.test(e.detail || '')) return 'This needs the admin role. Switch Role to admin in the top bar.';
  if (e.status === 403) return 'Pick a firm in the top bar.';

/* ---------- the one fetch helper ---------- */
async function api(method, path, opts = {}) {
  const quiet = opts.quiet || [];
  const headers = {};
  if (path.startsWith('/v1/')) { headers['X-Dev-Firm-Id'] = state.firm; headers['X-Dev-Role'] = state.role; }
  let body;
  if (opts.form) body = opts.form;
  else if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.json); }
  let res;
  try {
    res = await fetch(path, { method, headers, body, cache: 'no-store' });
  } catch (err) {
    const e = new ApiError({ status: 0, title: 'Network error', detail: String(err.message || err), method, path });
    if (!quiet.includes(0)) report(e);
    throw e;
  }
  if (res.ok) {
    if (opts.blob) return res.blob();
    const text = await res.text();
    if (!text) return null;
    if ((res.headers.get('content-type') || '').includes('json')) {
      try { return JSON.parse(text); } catch (err) { const e = new ApiError({ status: res.status, title: 'Bad JSON', detail: 'The response was not valid JSON.', method, path }); report(e); throw e; }
    }
    return text;
  }
  let p = {};
  try { p = await res.json(); } catch (err) { p = {}; }
  const e = new ApiError({
    status: res.status, title: p.title || res.statusText || 'Error', detail: readableDetail(p.detail) || null,
    correlation_id: p.correlation_id || res.headers.get('x-request-id'), instance: p.instance, method, path,
  });
  if (!quiet.includes(res.status)) report(e);
  throw e;
}

  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

  document.querySelectorAll('#sidenav a').forEach((a) => {
    const on = a.dataset.view === navKey; a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  revokeBlobs(); localActs = {}; localForms = {}; localChanges = {};
  document.documentElement.dataset.busy = '1';
  const ctx = { ...r, alive: () => my === seq };
  const key = r.name + '/' + (r.arg || '');
  if (key !== lastKey) view.innerHTML = '<p class="muted">Loading...</p>'; // a refresh of the same view keeps it on screen
  lastKey = key;
  try {
    if (!fn) { setTitle('Not found'); setView(h`<section class="card"><h1>No such view</h1><p>Go to the <a href="#/overview">overview</a>.</p></section>`); }
    else await fn(ctx);
  } catch (e) {
    if (ctx.alive()) {
      if (!(e instanceof ApiError)) reportJs(e);
      setView(h`<section class="card"><h1>This view did not load</h1><p>${e.status ? e.status + ' ' : ''}${e.title || e.message}</p>${e.detail ? h`<p class="muted">${e.detail}</p>` : ''}<p><button class="btn" data-act="reroute">Try again</button></p></section>`);
    }
  } finally {
    if (ctx.alive()) document.documentElement.dataset.busy = '0';
  }
}

function meter(label, used, max, fmt) {
  const pct = max > 0 && used !== null && used !== undefined ? Math.min(100, (used / max) * 100) : 0;
  const tone = pct >= 100 ? 'red' : pct >= 80 ? 'amber' : '';
  return h`<div><div class="meter-top"><span>${label}</span><span class="mono">${used === null || used === undefined ? 'not reported' : fmt(used)} of ${fmt(max)}</span></div>
    <div class="bar" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${used || 0}"><span class="fill ${tone ? 'fill-' + tone : ''}" style="width: ${pct.toFixed(1)}%"></span></div></div>`;
}
function traceSection(c, trace) {
  const run = (trace && trace.run) || c.run;
  if (!run) return h`<section class="card" id="trace"><h2>Run and trace</h2><p class="muted">No run yet.${c.status === 'submitted' ? ' The claim waits for the worker.' : ''}</p>${c.status === 'submitted' ? workerCmds() : ''}</section>`;
  // finished_at stays empty on a run that stopped for a person (capped, waiting_human) or failed, not only while it runs.
  const UNFINISHED = { running: 'still running', waiting_human: 'paused, waiting for a person', capped: 'stopped at a cap, waiting for a person', failed: 'failed before it finished' };
  const secs = run.finished_at ? ((new Date(run.finished_at) - new Date(run.started_at)) / 1000).toFixed(2) + ' s wall clock' : (UNFINISHED[run.status] || 'not finished');
  const used = trace && trace.used, caps = trace && trace.caps;
  return h`<section class="card" id="trace">
    <h2>Run and trace</h2>
    <dl class="kv">
      <dt>Run</dt><dd>${idChip(run.run_id)} <span class="tag">${run.graph}</span> ${badge(run.status)}</dd>
      <dt>Steps</dt><dd>${run.steps} logged${used ? h`, ${used.steps} counted toward the cap` : ''}</dd>
      <dt>Cost</dt><dd>$${run.cost_usd} charged${used ? h`, $${used.cost_usd} nominal` : ''}</dd>
      <dt>Time</dt><dd>${fmtTime(run.started_at)}, ${secs}</dd>
    </dl>
    ${caps ? h`<div class="meters">${meter('Steps', used ? used.steps : null, caps.max_steps, (v) => String(v))}${meter('Cost (USD)', used ? Number(used.cost_usd) : null, Number(caps.max_usd), (v) => '$' + Number(v).toFixed(4))}${meter('Step seconds', used ? used.seconds : null, caps.max_seconds, (v) => Number(v).toFixed(1) + ' s')}</div>
      <p class="small muted">The meters show what counts toward the run caps: counted steps, nominal cost, and the sum of each step's recorded latency. A replayed run is charged nothing and can finish faster than its recorded step seconds.</p>` : ''}
    ${trace && trace.steps ? (trace.steps.length ? h`<ol class="trace">${trace.steps.map(stepHtml)}</ol>` : h`<p class="muted">The run has no steps yet.</p>`) : h`<p class="muted">The trace did not load.</p>`}
  </section>`;
}

    }

// Issued links are PORTAL_BASE_URL/<token>, for example http://localhost:3000/claim/dev.<firm>.<claim>, so the token
// is the link's last path segment. Also accepts a bare token or this console's own #/portal/<token> address.
function tokenFrom(s) {
  s = String(s || '').trim();
  const dev = /dev\.[0-9a-f-]{36}\.[0-9a-f-]{36}/i.exec(s);
  if (dev) return dev[0];
  const i = s.indexOf('#/portal/');
  s = i >= 0 ? s.slice(i + 9) : s.split(/[?#]/)[0];
  let t = s.split('/').filter(Boolean).pop() || '';

}

  fitFont(g, 'MODEL ' + model, w - 56, 56, 'bold'); g.fillText('MODEL ' + model, x + 28, y + 118);
  fitFont(g, 'S/N ' + serial, w - 56, 34, '500'); g.fillText('S/N ' + serial, x + 28, y + 168);
  g.font = '20px system-ui, sans-serif'; g.fillText('120V~ 60Hz 1.5A', x + 28, y + 206);
  let bx = x + 28;
  while (bx < x + w - 40) { const bw = 2 + Math.floor(R() * 4); g.fillRect(bx, y + 226, bw, 48); bx += bw + 2 + Math.floor(R() * 4); }

}

/* ---------- fraud rings ---------- */
function ringCard(ring, i, nodes, edges) {
  const n = ring.length, VH = n === 2 ? 84 : 200, cx = 100, cy = VH / 2; // a pair needs only a short strip
  const R = n <= 2 ? 54 : n <= 6 ? 62 : 72, r = n > 12 ? 6 : 10;
  const start = n === 2 ? Math.PI : -Math.PI / 2;
  const pos = new Map(ring.map((id, k) => [id, [cx + R * Math.cos(start + (2 * Math.PI * k) / n), cy + R * Math.sin(start + (2 * Math.PI * k) / n)]]));
  const groups = new Map();
  edges.forEach((e) => { const key = [e.a, e.b].sort().join('|'); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(e); });
  const f1 = (v) => v.toFixed(1);
  const lines = [];
  groups.forEach((list) => list.forEach((e, j) => {
    const [x1, y1] = pos.get(e.a), [x2, y2] = pos.get(e.b);
    const k = KIND[e.kind] || { label: e.kind, color: 'var(--gray-fg)', dash: '' };
    const style = `stroke: ${k.color}; stroke-dasharray: ${k.dash || 'none'}`;
    const off = (j - (list.length - 1) / 2) * 18;
    if (!off) { lines.push(h`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" style="${style}"><title>${k.label}</title></line>`); return; }
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, qx = (x1 + x2) / 2 - ((y2 - y1) / len) * off * 2, qy = (y1 + y2) / 2 + ((x2 - x1) / len) * off * 2;
    lines.push(h`<path d="M${f1(x1)} ${f1(y1)} Q${f1(qx)} ${f1(qy)} ${f1(x2)} ${f1(y2)}" style="${style}"><title>${k.label}</title></path>`);
  }));
  const kinds = [...new Set(edges.map((e) => e.kind))];
  const dots = ring.map((id) => {
    const [x, y] = pos.get(id), st = (nodes.get(id) || {}).status || 'unknown';
    return h`<a href="#/claim/${id}" aria-label="Claim ${shortId(id)}, ${st}"><circle class="node" cx="${f1(x)}" cy="${f1(y)}" r="${r}" style="fill: var(--${TONES[st] || 'gray'}-fg)"><title>claim ${id} (${st})</title></circle></a>`;
  });
  return h`<figure class="ring-card"><svg viewBox="0 0 200 ${VH}" role="img" aria-label="Ring ${i + 1}: ${n} claims linked by ${kinds.join(', ')}"><g class="edges">${lines}</g><g>${dots}</g></svg>
    <figcaption><strong>Ring ${i + 1}</strong> <span class="muted">${n} claims</span><div>${kinds.map(kindTag)}</div></figcaption></figure>`;
}
async function viewFraud(ctx) {
  setTitle('Fraud rings');
  const p = currentProgram(); if (!p) return noProgram();
  let g;
  try { g = await api('GET', `/v1/programs/${p.id}/fraud-graph?limit=500`, { quiet: [503] }); } catch (e) {
    if (!ctx.alive()) return;
    if (e.status === 503) {
      setView(h`<div class="page-head"><h1>Fraud rings</h1><span class="spacer"></span><button class="btn" data-act="reroute">Try again</button></div><section class="card">
        <div class="note t-amber"><strong>The fraud graph is unavailable (503).</strong> ${e.detail || ''}</div>

        <p class="muted">Claim decisions and payouts never depend on the graph, so everything else keeps working.</p></section>`);
      return;
    }
    throw e;
  }

    <p class="small muted">Node color is the claim status, line color and pattern the kind of link. Hover a node for its id and click it to open the claim.</p>
  </section>

  ${g.rings.length ? h`<section class="card flush"><div class="table-wrap tall"><table><thead><tr><th>Ring</th><th class="num">Size</th><th>Link kinds</th><th>Members</th></tr></thead><tbody>

let mprManual = '{}';
function fmtBox(v) {

  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (v === null || v === undefined) return NONE;
  return h`<span class="mono">${typeof v === 'number' ? v.toLocaleString('en-US') : v}</span>`;
}
function mprReport(rep) {
  const pl = rep.payload || {}, boxes = pl.boxes || {}, computed = pl.computed || {}, manual = pl.manual || {};
  const disc = (pl.reconciliation && pl.reconciliation.discrepancies) || [];
  const keys = [...BOX_ORDER.filter((k) => k in boxes), ...Object.keys(boxes).filter((k) => !BOX_ORDER.includes(k)).sort()];
  return h`<section class="card">
    <div class="row wrap"><h2 style="margin: 0">Report for ${pl.period || rep.period_start}</h2>${rep.reconciled ? h`<span class="badge t-green">reconciled</span>` : h`<span class="badge t-red">not reconciled</span>`}
      <span class="small muted">${rep.period_start} to ${rep.period_end}, generated ${fmtTime(rep.generated_at)}</span>${idChip(rep.id)}</div>
    ${disc.length ? h`<div class="note t-red"><strong>The report and the independent recount disagree:</strong><pre>${pretty(disc)}</pre></div>` : h`<p class="small muted">The independent recount agrees with every computed box.</p>`}

      ${keys.map((k) => h`<tr><td class="mono">${k}</td><td>${fmtBox(boxes[k])}</td><td>${k in manual ? h`<span class="tag tag-human">entered</span>` : k in computed ? h`<span class="tag tag-ok">computed</span>` : h`<span class="muted small">default</span>`}</td></tr>`)}

    <details><summary>Full payload</summary><pre>${pretty(pl)}</pre></details>
  </section>`;
}

  </div>
  <section class="card"><h2>Notices by channel and status</h2>${Object.keys(s.notifications).length ? countsTable(s.notifications) : h`<p class="muted">No notices yet.</p>`}</section>
  <section class="card"><h2>Sample drafts</h2>${s.sample.length ? s.sample.map((x) => h`<details><summary>${x.channel}, ${x.status}: ${x.subject || 'no subject'}</summary><pre class="wrap">${x.body}</pre></details>`) : h`<p class="muted">No drafts yet.</p>`}</section>`);
  // shows(summary) is true once the summary reflects the write; viewCampaigns re-reads until it is (see settle).
  const done = (label, extra, shows) => { campLast = { program: p.id, label, shows, ...extra }; if (ctx.alive()) route(); };
  const notices = (x, ch, status) => Object.entries(x.notifications).filter(([k]) => k.startsWith(ch + ':') && (!status || k === `${ch}:${status}`)).reduce((a, [, n]) => a + n, 0);
  localForms.regUpload = async (form, fd) => {
    const file = fd.get('file');
    if (!file || !file.size) { toast('Choose a CSV first.'); return; }
    const out = new FormData(); out.append('file', file, file.name);
    const up = await api('POST', `/v1/programs/${p.id}/registrations`, { form: out });
    done('upload', { upload: up }, (x) => x.registrations >= up.accepted);
  };
  localActs.campMatch = async () => {
    const { counts } = await api('POST', `/v1/programs/${p.id}/campaign/match`);
    done('match', { counts }, (x) => x.matched === counts.matched && x.unmatched === counts.unmatched); // match rescores every registration
  };
  localForms.campDrafts = async (form, fd) => {
    const channels = fd.getAll('ch');
    if (!channels.length) { toast('Pick at least one channel.'); return; }
    const { counts } = await api('POST', `/v1/programs/${p.id}/campaign/drafts`, { json: { channels } });
    done('drafts', { counts }, (x) => Object.keys(counts).every((ch) => notices(x, ch) >= counts[ch]));
  };
  localForms.campSend = async (form, fd) => {
    const channel = fd.get('channel') || null;
    const { counts } = await api('POST', `/v1/programs/${p.id}/campaign/send`, { json: { channel } });
    done('send', { counts }, (x) => Object.keys(counts).every((ch) => notices(x, ch, 'sent') >= counts[ch]));
  };
}

/* ---------- recalls ---------- */
async function viewRecalls(ctx) {
  setTitle('Recalls');
  const q = ctx.query.get('q') || '', since = ctx.query.get('since') || '', limit = ['10', '25', '50', '100'].includes(ctx.query.get('limit')) ? ctx.query.get('limit') : '25';
  const params = new URLSearchParams({ limit }); if (q) params.set('q', q); if (since) params.set('since', since);
  const r = await api('GET', '/v1/recalls?' + params);
  if (!ctx.alive()) return;
  setView(h`
  <div class="page-head"><h1>Recalls</h1><span class="muted">The public CPSC archive, keyword search</span></div>
  <section class="card">
    <form data-form="recallSearch" class="row wrap end">
      <label class="field grow"><span>Search</span><input type="search" name="q" value="${q}" placeholder="laminator, TL1302Z, stroller"></label>
      <label class="field"><span>Since</span><input type="date" name="since" value="${since}"></label>
      <label class="field"><span>Show</span><select name="limit">${['10', '25', '50', '100'].map((n) => h`<option value="${n}" ${n === limit ? raw('selected') : ''}>${n}</option>`)}</select></label>
      <button class="btn primary">Search</button>
    </form>
    <p class="small muted">${fmtNum(r.total)} ${r.total === 1 ? 'match' : 'matches'}${q ? h` for <strong>${q}</strong>, best first` : ', newest first'}. Opening a program extracts its rules from the notice. Admin only.</p>
  </section>
  <section class="card flush"><div class="table-wrap tall"><table><thead><tr><th>Date</th><th>Title</th><th class="num">Units</th><th>Category</th><th>Source</th><th></th></tr></thead><tbody>
    ${r.items.length ? r.items.map((x) => h`<tr><td class="nowrap">${x.recall_date}</td><td>${x.title}</td>
      <td class="num">${fmtNum(x.units_affected)}${x.units_status !== 'ok' ? h` <span class="tag" title="units parse status">${x.units_status}</span>` : ''}</td>
      <td>${or(x.category)}</td><td class="nowrap"><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">CPSC ${x.source_id}</a></td>
      <td><button class="btn small" data-act="openProgram" data-id="${x.id}">Open a program</button></td></tr>`) : h`<tr><td colspan="6" class="empty">No recalls match.</td></tr>`}
  </tbody></table></div></section>`);
  localForms.recallSearch = (form, fd) => {
    const n = new URLSearchParams();
    for (const k of ['q', 'since', 'limit']) { const v = String(fd.get(k) || '').trim(); if (v) n.set(k, v); }
    go('#/recalls?' + n);
  };
  localActs.openProgram = async (el) => {
    const prog = await api('POST', '/v1/programs', { json: { recall_id: el.dataset.id } });
    toast(`Program created with status ${prog.status}. Review its rules.`);
    await loadPrograms();
    selectProgram(prog.id, true);
    go('#/program/' + prog.id);
  };
}

/* ---------- program ---------- */
let programWant = null;
function evidenceList(ev) {
  if (!ev || !ev.length) return '';
  return h`<details><summary>Evidence quotes from the notice (${ev.length})</summary><ul class="evidence small">${ev.map((s) => h`<li><span class="mono">${s.field}</span>: "${s.quote}" <span class="muted">[${s.start}, ${s.end}]</span></li>`)}</ul></details>`;
}
async function viewProgram(ctx) {
  setTitle('Program');
  const id = ctx.arg || state.program;
  if (!id) return noProgram();
  let p;
  const want = programWant && programWant.id === id ? programWant : null; programWant = null; // the PATCH just made (see settle)
  try {
    p = await settle(() => api('GET', `/v1/programs/${id}`, { quiet: [404] }),
      (x) => !want || (x.status === want.status && x.value_threshold_cents === want.value_threshold_cents
        && JSON.stringify([x.identification_rules, x.remedy_rules]) === JSON.stringify([want.identification_rules, want.remedy_rules])), ctx);
  } catch (e) {
    if (!ctx.alive()) return;
    if (e.status === 404) { setView(h`<section class="card"><h1>This firm cannot see that program</h1><div class="note t-amber">GET /v1/programs/${id} answered 404. The program belongs to another firm (tenant isolation) or does not exist.</div></section>`); return; }
    throw e;
  }
  if (!ctx.alive()) return;
  const ir = p.identification_rules || {}, rr = p.remedy_rules || {};
  setView(h`
  <div class="page-head"><h1>Program</h1>${badge(p.status)}${idChip(p.id)}<span class="spacer"></span>
    ${p.id !== state.program ? h`<button class="btn" data-act="selectProgram" data-id="${p.id}">Select in the top bar</button>` : h`<span class="tag">selected</span>`}
    <button class="btn" data-act="reroute">Refresh</button></div>
  <p class="lead">${p.title}</p>
  <div class="stats">${stat('Value threshold', money(p.value_threshold_cents))}${stat('Units affected', or(fmtNum(p.units_affected)))}${stat('Claims', sum(p.claim_counts))}${stat('Opened', p.opened_at ? fmtTime(p.opened_at).slice(0, 10) : 'not yet')}</div>
  <div class="counts" style="margin-bottom: 16px">${countBadges(p.id, p.claim_counts)}</div>
  <div class="grid2">
    <section class="card"><h2>Identification rules</h2><dl class="kv">
      <dt>Models</dt><dd>${ir.models && ir.models.length ? ir.models.map((x) => h`<code>${x}</code> `) : NONE}</dd>
      <dt>Serial ranges</dt><dd>${ir.serial_ranges && ir.serial_ranges.length ? h`<ul>${ir.serial_ranges.map((s) => h`<li><span class="mono">${s.raw}</span> <span class="muted small">${s.prefix ? 'prefix ' + s.prefix + ', ' : ''}${s.start || '?'} to ${s.end || '?'}</span></li>`)}</ul>` : NONE}</dd>
      <dt>Date codes</dt><dd>${ir.date_codes && ir.date_codes.length ? h`<ul>${ir.date_codes.map((s) => h`<li><span class="mono">${s.raw}</span> <span class="muted small">format ${s.format}, ${s.start || '?'} to ${s.end || '?'}</span></li>`)}</ul>` : NONE}</dd>
      <dt>Sold at</dt><dd>${ir.sold_at && ir.sold_at.length ? ir.sold_at.map((x) => h`<span class="tag">${x}</span> `) : NONE}</dd>
      <dt>Sale window</dt><dd>${ir.sold_from || ir.sold_to ? `${ir.sold_from || 'open'} to ${ir.sold_to || 'open'}` : NONE}</dd>
      <dt>Price range</dt><dd>${ir.price_range_cents ? `${money(ir.price_range_cents.min_cents)} to ${money(ir.price_range_cents.max_cents)}` : NONE}</dd>
      <dt>Units</dt><dd>${or(fmtNum(ir.units_affected))}</dd>
      <dt>Label location</dt><dd>${or(ir.model_label_location)}</dd>
    </dl>${evidenceList(ir.evidence)}</section>
    <section class="card"><h2>Remedy rules</h2><dl class="kv">
      <dt>Remedy type</dt><dd>${or(rr.remedy_type)}</dd>
      <dt>Destruction</dt><dd>${or(rr.destruction_instruction)}</dd>
      <dt>Registration</dt><dd>${rr.registration_url ? h`<a href="${safeUrl(rr.registration_url)}" target="_blank" rel="noopener noreferrer">${rr.registration_url}</a>` : NONE}</dd>
      <dt>Contact</dt><dd>${or(rr.contact)}</dd>
    </dl>
    <h3>Options</h3>${rr.options && rr.options.length ? rr.options.map((o) => h`<div class="option"><strong>${o.type}</strong>
      <div class="small">Proof required: ${o.proof_required.length ? o.proof_required.map((x) => h`<span class="tag">${x}</span> `) : NONE}</div>
      ${o.steps.length ? h`<ol class="small">${o.steps.map((x) => h`<li>${x}</li>`)}</ol>` : ''}
      <div class="small muted">Payout: ${o.payout && o.payout.method ? o.payout.method : 'method not stated'}${o.payout && o.payout.amount_rule ? ', ' + o.payout.amount_rule : ''}</div></div>`) : h`<p class="muted">No options.</p>`}
    ${evidenceList(rr.evidence)}</section>
  </div>
  <div class="grid2">
    <section class="card"><h2>Status and threshold</h2>
      <form data-form="patchStatus" class="row wrap end"><label class="field"><span>Status</span><select name="status">${['draft', 'open', 'closed'].map((s) => h`<option value="${s}" ${s === p.status ? raw('selected') : ''}>${s}</option>`)}</select></label><button class="btn primary">Save status</button></form>
      <form data-form="patchThreshold" class="row wrap end"><label class="field"><span>Value threshold in dollars</span><input type="number" name="dollars" min="0" step="0.01" value="${(p.value_threshold_cents / 100).toFixed(2)}"></label><button class="btn primary">Save threshold</button></form>
      <p class="small muted">An approval above the threshold waits for a person. Changes need the admin role and go to the audit log. Closing is permanent: a closed program cannot be reopened, and its claim links stop working.</p>
    </section>
    <section class="card"><h2>Issue claim links</h2>
      <form data-form="issueLinks" class="row wrap end"><label class="field"><span>How many</span><input type="number" name="n" min="1" max="50" value="3"></label><button class="btn primary">Issue</button></form>
      <div id="issueResult"></div>
    </section>
  </div>
  <section class="card"><details><summary>Edit the rules as JSON</summary>
    <p class="small muted">Sends PATCH with identification_rules and remedy_rules. The API validates them against the rule schema.</p>
    <div class="grid2"><label class="field"><span>identification_rules</span><textarea id="irJson" rows="14" class="mono">${pretty(ir)}</textarea></label><label class="field"><span>remedy_rules</span><textarea id="rrJson" rows="14" class="mono">${pretty(rr)}</textarea></label></div>
    <button class="btn primary" data-act="patchRules">Save rules</button>
  </details></section>`);
  const patch = async (body, label) => {
    const np = await api('PATCH', `/v1/programs/${p.id}`, { json: body });
    toast(label + ' saved');
    programWant = np;
    await loadPrograms();
    const i = state.programs.findIndex((x) => x.id === np.id); // the list can be read before the PATCH commits
    if (i >= 0) { state.programs[i] = np; renderProgramSel(); }
    if (ctx.alive()) route();
  };
  localForms.patchStatus = (form, fd) => {
    const status = fd.get('status');
    if (status === p.status) { toast(`The program is already ${status}.`); return null; }
    if (status === 'closed' && !window.confirm(`Close "${trunc(p.title, 80)}"? A closed program cannot be reopened, and every claim link it issued stops working.`)) return null;
    return patch({ status }, 'Status');
  };
  localForms.patchThreshold = (form, fd) => {
    const d = Number(fd.get('dollars'));
    if (!isFinite(d) || d < 0) { toast('Enter a dollar amount of 0 or more.'); return null; }
    return patch({ value_threshold_cents: Math.round(d * 100) }, 'Threshold');
  };
  localActs.patchRules = () => {
    let a, b;
    try { a = JSON.parse($('#irJson').value); b = JSON.parse($('#rrJson').value); } catch (e) { toast('The rules are not valid JSON: ' + e.message); return null; }
    return patch({ identification_rules: a, remedy_rules: b }, 'Rules');
  };
  localForms.issueLinks = async (form, fd) => {
    const n = Math.max(1, Math.min(50, Number(fd.get('n')) || 1));
    const r = await api('POST', `/v1/programs/${p.id}/claims/issue`, { json: { n } });
    $('#issueResult').innerHTML = h`<p class="small">Issued ${r.links.length} draft claims. Open one as the claimant:</p><ul>${r.links.map((l) => h`<li>${claimLink(l.claim_id)} <a href="#/portal/${encodeURIComponent(tokenFrom(l.url))}">open in the portal</a></li>`)}</ul>`.s;
  };
}

/* ---------- delegated events ---------- */
const globalActs = {
  copy: (el) => copyText(el.dataset.text),
  dismiss: (el) => { el.closest('.err').remove(); syncErrors(); },
  dismissAll: () => { errorsEl.innerHTML = ''; },
  reroute: () => route(),
  selectProgram: (el) => selectProgram(el.dataset.id),
  gotoClaims: (el) => { selectProgram(el.dataset.id, true); go('#/claims?status=' + encodeURIComponent(el.dataset.status)); },
  switchFirm: async (el) => { await setFirm(el.dataset.id); route(); },
};
async function runGuarded(el, fn) {
  const btn = el && el.tagName === 'BUTTON' ? el : null;
  if (btn) { if (btn.dataset.busy) return; btn.dataset.busy = '1'; btn.disabled = true; }
  try { await fn(); } catch (e) { if (!(e instanceof ApiError)) reportJs(e); } finally { if (btn) { delete btn.dataset.busy; btn.disabled = false; } }
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (el) {
    const fn = localActs[el.dataset.act] || globalActs[el.dataset.act];
    if (fn) { ev.preventDefault(); runGuarded(el, () => fn(el, ev)); }
    return;
  }
  const row = ev.target.closest('tr[data-href]');
  if (row && !ev.target.closest('a, button, input, select, textarea, summary, label')) location.hash = row.dataset.href;
});
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  const row = ev.target.closest && ev.target.closest('tr[data-href]');
  if (row && ev.target === row) location.hash = row.dataset.href;
});
document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fn = localForms[form.dataset.form];
  if (!fn) return;
  const btn = ev.submitter || form.querySelector('button:not([type=button])');
  runGuarded(btn || form, () => fn(form, new FormData(form)));
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t && t.dataset && t.dataset.pp && portal.payout) portal.payout[t.dataset.pp] = t.value;
  const el = t.closest && t.closest('[data-change]');
  if (!el) return;
  const fn = localChanges[el.dataset.change];
  if (fn) runGuarded(el, () => fn(el, ev));
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el && el.dataset && el.dataset.pf && portal.form) portal.form[el.dataset.pf] = el.value;
  if (el && el.dataset && el.dataset.pp && portal.payout) portal.payout[el.dataset.pp] = el.value;
});

/* ---------- start ---------- */
async function init() {
  bindTopbar();
  renderFirmSel();
  roleSel.value = state.role;
  await loadPrograms();
  checkReady().catch(reportJs);
  setInterval(() => { if (document.visibilityState === 'visible') checkReady().catch(() => {}); }, 15000);
  window.addEventListener('hashchange', route);
  await route();
}
init().catch(reportJs);
</script>
</body>
</html>
