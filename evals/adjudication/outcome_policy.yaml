# Expected adjudication outcome per planted violation. Decided 2026-10-17 (owner delegated the call): the
# contested line, retailer_not_listed, stays needs_info because secondhand and gift owners still hold recalled units.
# Ground truth for the synthetic golden set and the spec the rules-only decision table implements.
# A claim with several violations takes the highest outcome in this precedence order.
precedence: [flag, deny, needs_info, approve]

clean: approve

violations:
  wrong_model: deny                # the claimed model is not a recalled model
  serial_out_of_range: deny        # only planted when the notice has serial rules
  date_code_out_of_range: deny     # only planted when the notice has date-code rules
  purchase_before_window: deny     # bought before the recalled units were sold
  retailer_not_listed: needs_info  # secondhand and gift owners exist; ask for proof rather than deny
  no_receipt_when_required: needs_info
  destruction_not_shown: needs_info  # ask for the destruction photo (missing, or a re-upload of the label)
  duplicate_photo: flag            # both claims in the pair are flagged
  duplicate_address: flag
  duplicate_serial: flag
  duplicate_payout: flag

# Not an outcome: claims whose refund exceeds the program's value threshold are routed to a human
# regardless of outcome (reported as "share routed to human").

# Revision 2 (2026-10-18, before any row that reads photos is run): rules for what the label and destruction
# photos show. Every row that reads photos applies them through the same channel: the rules_plus_vision decision
# table implements them in code, and the agent rows get the same rules in their instructions (never only through
# retrieved documents). Rows that do not read photos (rules_only) cannot apply them.
photo_rules:
  label_shows_other_model: deny            # a legible label shows a model that is not recalled, whatever was typed
  label_unreadable: needs_info             # the label photo cannot be read: ask for a clearer photo
  label_confirms_typed_typo: approve       # typed model is a confusable typo, the legible label shows a recalled model
  label_confirms_missing_typed_model: approve  # no typed model, the legible label shows a recalled model
  destruction_photo_intact: needs_info     # the destruction photo does not show the instructed destruction
